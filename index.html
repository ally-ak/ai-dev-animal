<body>
<title>AI開発どうぶつ診断</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --ink: #2f2a2a;
  --muted: #8c8585;
  --line: #ece7e2;
  --soft: #faf8f6;
  --fire: #e88a6b;   --fire-tint: #fdeee8;
  --earth: #5f9f74;  --earth-tint: #e8f3eb;
  --air: #6b8fc6;    --air-tint: #e9f0fa;
  --water: #9479c2;  --water-tint: #f1ebf8;
  --mincho: "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --gothic: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --serif-en: "Cormorant Garamond", Georgia, serif;
}
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--gothic); font-weight: 400;
  line-height: 1.9; letter-spacing: .02em; -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding: 20px max(16px, env(safe-area-inset-right)) 80px max(16px, env(safe-area-inset-left));
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.topbar { display: flex; justify-content: flex-end; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; font-size: 12px; letter-spacing: .08em; }
.lang button { padding: 3px 12px; border-radius: 999px; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.kicker { display: block; font-family: var(--serif-en); font-style: italic; font-weight: 500; font-size: 15px; letter-spacing: .14em; color: var(--muted); }
.title { font-family: var(--mincho); font-weight: 700; letter-spacing: .06em; line-height: 1.45; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* 表紙 */
.cover { text-align: center; padding-top: 28px; }
.cover h1 { font-size: clamp(30px, 8.4vw, 42px); margin: 6px 0 18px; }
.cover .lead { text-align: left; font-size: 15px; margin: 0 auto 36px; max-width: 30em; }
.from { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--soft); border-radius: 16px; padding: 12px 16px; margin: 0 0 24px; }
.from .disc { width: 64px; flex: none; }
.from p { margin: 0; font-family: var(--mincho); font-size: 15px; line-height: 1.7; }
.cast-title { font-family: var(--mincho); font-weight: 500; font-size: 15px; letter-spacing: .2em; margin-bottom: 18px; display: flex; align-items: center; gap: 14px; }
.cast-title::before, .cast-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cast { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px 10px; margin-bottom: 40px; }
@media (min-width: 520px) { .cast { grid-template-columns: repeat(4, 1fr); } }
.cast-item { display: grid; justify-items: center; gap: 6px; text-align: center; }
.cast-item .disc { width: 84%; }
.cast-item b { font-family: var(--mincho); font-weight: 700; font-size: 12.5px; line-height: 1.35; letter-spacing: 0; white-space: nowrap; }
.cast-item .seg { font-style: normal; display: inline-block; }
.cast-item span { font-size: 11.5px; color: #6f6767; line-height: 1.45; padding: 0 2px; }

.cast-item { padding: 6px 0 4px; border-radius: 14px; transition: background .2s; }
.cast { margin-bottom: 12px !important; }
.cast-hint { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: .06em; }
.crumb { margin: 10px 0 0; }
.back-link { font-size: 13px; color: var(--muted); padding: 6px 0; }
.mine { display: inline-block; font-size: 11.5px; letter-spacing: .12em; color: #fff; background: var(--ink); border-radius: 999px; padding: 2px 12px; margin-bottom: 10px; }
.match { width: 100%; text-align: left; border-radius: 14px; padding: 6px; transition: background .2s; }
.match:hover { background: var(--soft); }
.facets dd b { font-family: var(--mincho); }
.prompt-list { list-style: none; counter-reset: pr; padding: 0; margin: 0; display: grid; gap: 12px; }
.prompt-list li { counter-increment: pr; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; }
.prompt-list li::before { content: counter(pr, decimal-leading-zero); font-family: var(--serif-en); font-style: italic; font-size: 17px; color: var(--muted); line-height: 1.6; }
.prompt-list summary { cursor: pointer; font-family: var(--mincho); font-weight: 700; font-size: 15px; line-height: 1.6; list-style: none; }
.prompt-list summary::-webkit-details-marker { display: none; }
.prompt-list summary::after { content: "＋"; float: right; color: var(--muted); font-weight: 400; }
.prompt-list details[open] summary::after { content: "−"; }
.prompt-list .text { font-size: 13.5px; line-height: 1.85; white-space: pre-wrap; margin: 10px 0 12px; color: #3f3939; }
.prompt-list .row { display: flex; justify-content: flex-end; }
.friend[aria-current="true"] { background: var(--soft); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; font-family: var(--mincho); font-size: 14px; }
.pager button { padding: 8px 0; text-align: left; }
.pager button:last-child { text-align: right; }
.disc { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
.disc .chara { width: 92%; height: 92%; }
.t-fire { background: var(--fire-tint); } .t-earth { background: var(--earth-tint); }
.t-air { background: var(--air-tint); }   .t-water { background: var(--water-tint); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  box-sizing: border-box; min-height: 54px; padding: 12px 20px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: #fff; line-height: 1.6;
  font-weight: 500; font-size: 15px; letter-spacing: .12em; text-decoration: none; transition: opacity .2s;
}
.btn:hover { opacity: .85; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.small { width: auto; min-height: 38px; padding: 6px 18px; font-size: 13px; letter-spacing: .08em; }
.btn-note { margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }

/* 設問 */
.quiz { padding-top: 24px; }
.progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
.progress i { display: block; height: 100%; background: var(--ink); transition: width .35s ease; }
.q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; font-size: 13px; }
.q-top .back { color: var(--muted); padding: 6px 0; }
.q-top .back:disabled { visibility: hidden; }
.q-count { font-family: var(--serif-en); font-style: italic; font-size: 17px; letter-spacing: .1em; }
.q-watch { width: 92px; margin: 0 auto 18px; }
.q-title { font-size: clamp(19px, 5.4vw, 23px); text-align: center; margin: 0 0 30px; }
.options { display: grid; gap: 12px; }
.option {
  width: 100%; text-align: left; padding: 16px 20px; border: 1px solid var(--line); border-radius: 14px;
  font-size: 15px; line-height: 1.6; background: #fff; transition: border-color .2s, background .2s;
}
.option:hover { border-color: #cfc8c1; background: var(--soft); }
.option.picked { border-color: var(--ink); background: var(--soft); }

/* 読み込み */
.loading { text-align: center; padding-top: 90px; }
.loading .disc { width: 170px; margin: 0 auto 28px; background: var(--soft); }
.loading .chara { opacity: .35; filter: grayscale(1); }
.loading p { font-family: var(--mincho); font-size: 19px; letter-spacing: .14em; margin: 0; }

/* 結果 */
.hero { text-align: center; padding-top: 22px; }
.hero .disc { width: min(220px, 62vw); margin: 18px auto 20px; }
.hero h2 { font-size: clamp(30px, 8.6vw, 40px); margin: 0; letter-spacing: .08em; }
.hero .animal { font-size: 13px; color: var(--muted); letter-spacing: .14em; margin-top: 2px; }
.hero .pun { display: inline-block; margin-top: 10px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 14px; }
.chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
.chip { font-size: 12px; letter-spacing: .1em; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line); }
.hero .catch { font-family: var(--mincho); font-size: 17px; line-height: 1.8; margin: 22px auto 6px; max-width: 22em; }
.hero .phrase { font-size: 13px; color: var(--muted); }

.sec { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--line); }
.sec h3 { font-size: 21px; margin: 4px 0 22px; }
.sec p { margin: 0 0 14px; font-size: 15px; }

.axis { margin-bottom: 26px; }
.axis-name { font-size: 13px; color: var(--muted); margin-bottom: 10px; letter-spacing: .06em; }
.bar { display: grid; grid-template-columns: 7.2em 1fr 2.6em; align-items: center; gap: 12px; font-size: 13.5px; margin-bottom: 8px; }
.bar .track { height: 6px; border-radius: 6px; background: var(--soft); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bar .track i { display: block; height: 100%; border-radius: 6px; background: #d8d2cc; }
.bar.win { font-weight: 700; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar.win .n { color: var(--ink); }
.summary { font-family: var(--mincho); font-size: 16px !important; line-height: 1.9; background: var(--soft); border-radius: 14px; padding: 18px 20px; }
.keys { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 10px; }
.keys li { font-size: 14px; line-height: 1.7; padding-left: 14px; border-left: 2px solid var(--line); }
.keys li small { display: block; color: var(--muted); font-size: 12px; }
.keys-title { font-size: 13px; color: var(--muted); margin: 22px 0 4px; letter-spacing: .06em; }

.today { border-radius: 20px; padding: 26px 22px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; color: var(--muted); letter-spacing: .08em; margin-bottom: 14px; }
.today .message { font-family: var(--mincho); font-size: 18px; line-height: 1.9; margin: 0 0 22px; }
.today .waiting { text-align: center; }
.today .waiting p { font-family: var(--mincho); font-size: 16px; margin: 4px 0 20px; }
.prompt { background: #fff; border-radius: 14px; padding: 18px 18px 14px; }
.prompt .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.prompt .ptitle { display: block; font-family: var(--mincho); font-size: 17px; margin: 4px 0 8px; }
.prompt .text { display: block; font-size: 14px; line-height: 1.85; margin: 0 0 14px; white-space: pre-wrap; color: #3f3939; }
.prompt .row { display: flex; justify-content: flex-end; }
.slack { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--line); }
.news { background: #fff; border-radius: 14px; padding: 18px; margin-top: 14px; }
.news .label, .cheer .label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.news-title { display: block; font-family: var(--mincho); font-weight: 700; font-size: 16px; line-height: 1.6; color: var(--ink); margin: 6px 0 2px; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.news-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.news p { font-size: 14px !important; line-height: 1.85; margin: 0 0 8px !important; color: #3f3939; }
.news-why { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.news-why b { font-weight: 700; margin-right: 6px; }
.cheer { margin-top: 18px; text-align: center; }
.cheer p { font-family: var(--mincho); font-size: 16px !important; line-height: 1.9; margin: 6px 0 0 !important; }
.note { font-size: 12.5px; color: var(--muted); margin: 14px 0 0 !important; }

.aruaru { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
.aruaru li { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline; font-size: 14.5px; line-height: 1.7; }
.aruaru li::before { content: attr(data-tag); font-size: 11px; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.facets { margin: 26px 0 0; display: grid; gap: 20px; }
.facets dt { font-family: var(--mincho); font-weight: 700; font-size: 15px; letter-spacing: .08em; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.facets dt::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.facets dd { margin: 0; font-size: 15px; }
.care { font-family: var(--mincho); font-size: 16.5px !important; line-height: 1.95; }

.match { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; }
.match b { font-family: var(--mincho); font-size: 19px; display: block; }
.match span { font-size: 14px; color: var(--muted); }

.friends { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
@media (max-width: 400px) { .friends { grid-template-columns: repeat(3, 1fr); } }
.friend { display: grid; justify-items: center; gap: 4px; padding: 4px 0; border-radius: 12px; }
.friend .disc { width: 80%; }
.friend b { font-family: var(--mincho); font-size: 11.5px; line-height: 1.35; letter-spacing: 0; white-space: nowrap; }
.friend.me b::after { content: " ●"; color: var(--fire); font-size: 8px; vertical-align: middle; }
.friend[aria-pressed="true"] { background: var(--soft); }
.friend-detail { margin-top: 18px; background: var(--soft); border-radius: 14px; padding: 16px 18px; font-size: 14px; line-height: 1.8; }
.friend-detail b { font-family: var(--mincho); font-size: 16px; }

.actions { display: grid; gap: 12px; margin-top: 56px; }

.text-link { justify-self: center; font-size: 13px; color: var(--muted); padding: 10px 0; letter-spacing: .06em; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; text-align: center; line-height: 1.6; background: var(--ink); color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 999px; letter-spacing: .06em; z-index: 10; }

/* 入場 */
.fade { animation: fade .5s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* キャラの動き：ゆっくり、小さく */
.chara { width: 100%; height: 100%; overflow: visible; display: block; }
.chara .body { transform-origin: 50px 92px; }
.chara .blink { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .chara .blink { animation: blink 4.6s infinite; }
  .anim-hop .body { animation: hop 1.8s ease-in-out infinite; }
  .anim-sway .body { animation: sway 3s ease-in-out infinite; }
  .anim-bob .body { animation: bob 2.6s ease-in-out infinite; }
  .anim-tilt .body { animation: tilt 3.4s ease-in-out infinite; }
  .anim-nod .body { animation: nod 2.4s ease-in-out infinite; }
  .anim-breathe .body { animation: breathe 3.2s ease-in-out infinite; }
  .chara .fx { animation: fx 2.4s ease-in-out infinite; }
  .fade { animation: fade .5s ease both; }
}
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
.chara.still *, .still .chara * { animation: none !important; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.12); } }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
@keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes tilt { 0%, 55%, 100% { transform: rotate(0); } 70%, 85% { transform: rotate(-6deg); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(3deg) translateY(1px); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03, .98); } }
@keyframes fx { 0%, 100% { opacity: .9; transform: translateY(0); } 50% { opacity: .4; transform: translateY(-2px); } }
</style>

<div class="wrap">
  <div class="topbar"><div class="lang" role="group" aria-label="Language">
    <button data-lang="ja">日本語</button><button data-lang="en">English</button>
  </div></div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 軸 ---------- */
const ELEMENTS = {
  fire:  { ja: "速さ派",   en: "Speed",  long: { ja: "とにかく速く出したい", en: "ship it fast" } },
  earth: { ja: "確かめ派", en: "Verify", long: { ja: "ちゃんと確かめたい",   en: "make sure it's right" } },
  air:   { ja: "設計派",   en: "Design", long: { ja: "設計から考えたい",     en: "think it through first" } },
  water: { ja: "相棒派",   en: "Buddy",  long: { ja: "相棒と一緒に進めたい", en: "work it out together" } },
};
const STYLES = {
  pioneer: { ja: "新しもの好き", en: "Early adopter", long: { ja: "新しいモデルやツールをすぐ試す", en: "try new models and tools right away" } },
  steady:  { ja: "育てる人",     en: "Cultivator",    long: { ja: "自分の環境をじっくり育てる",     en: "grow a personal setup over time" } },
  flex:    { ja: "使い分け上手", en: "Orchestrator",  long: { ja: "AIを役割ごとに使い分ける",       en: "assign different AIs to different jobs" } },
};

/* ---------- 12匹 ---------- */
const TYPES = {
  "fire-pioneer": {
    trait: { ja: "新モデルは|発表当日に触る", en: "Tries every model on launch day" },
    name: { ja: "トリアエズ", en: "Chick It Out" }, animal: { ja: "ヒヨコ", en: "Chick" },
    pun: { ja: "「とりあえず」＋トリ", en: "“check it out” + chick — tries everything the day it ships" },
    phrase: { ja: "READMEはあとで読む", en: "I'll read the README later" },
    catch: { ja: "新しいモデルは、出たその日に本番タスクで試す", en: "Tries every new model on real work the day it ships" },
    body: {
      ja: "「とりあえず動かしてみる」ができる人です。新しいモデルやエージェントが出たら、READMEを読み終わる前に手元のタスクを投げている。まわりが様子見しているあいだに、あなたはもう「これは使える／使えない」を言えるところにいるんですよね。",
      en: "You're the one who can just try it. When a new model or agent drops, you've thrown a real task at it before finishing the README. While everyone else waits and sees, you can already say whether it's any good.",
    },
    aruaru: {
      ja: ["権限確認を全部スキップして走らせたことがある", "試したまま放置したAIツールのアカウントが10個ある", "リリースノートより先に、SNSで新機能を知る"],
      en: ["You've run an agent with every permission check skipped", "You have ten AI tool accounts you tried once and forgot", "You hear about new features on social media before the release notes"],
    },
    care: {
      ja: "速さが武器だからこそ、AIの「完了しました」を受け取ったまま次へ行きがち。マージ前の5分だけ、差分を自分の目で見てあげてください。",
      en: "Because speed is your edge, you tend to take “Done!” at face value and move on. Give the diff five minutes of your own eyes before you merge.",
    },

/* ---------- 保存 ---------- */
const KEY_TYPE = "aiuranai.type", KEY_OPEN = "aiuranai.opened", KEY_STREAK = "aiuranai.streak", KEY_ANS = "aiuranai.answers", KEY_LANG = "aiuranai.lang";
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const params = new URLSearchParams(location.search);
const FROM = params.get("from");
let lang = (["ja", "en"].includes(params.get("lang")) && params.get("lang")) || load(KEY_LANG) || ((navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en");
const L = v => (v && typeof v === "object" && "ja" in v) ? v[lang] : v;
const U = () => UI[lang];

function dateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function todayStr() { return dateStr(new Date()); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }
function daySeed() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
function fortuneFor(key) {
  const el = key.split("-")[0], idx = Object.keys(TYPES).indexOf(key), seed = daySeed();
  return { message: DAILY[el][(seed + idx * 3) % 7], prompt: (seed + idx) % 6, cheer: CHEER[el][(seed + idx * 5) % 7] };
}
function streak() { try { return JSON.parse(load(KEY_STREAK)) || { last: null, count: 0 }; } catch (e) { return { last: null, count: 0 }; } }
function markOpened() {
  const s = streak(), t = todayStr();
  if (s.last !== t) { s.count = s.last === yesterdayStr() ? s.count + 1 : 1; s.last = t; save(KEY_STREAK, JSON.stringify(s)); }
  save(KEY_OPEN, t);
}
function savedAnswers() { try { const a = JSON.parse(load(KEY_ANS)); return Array.isArray(a) && a.length === QUESTIONS.length ? a : null; } catch (e) { return null; } }

const disc = (key, still = false) => `<div class="disc t-${key.split("-")[0]}">${chara(key, still)}</div>`;

/* ---------- 判定 ---------- */
function score(ans) {
  const e = { fire: 0, earth: 0, air: 0, water: 0 }, s = { pioneer: 0, steady: 0, flex: 0 }, lastE = {}, lastS = {};
  ans.forEach((v, i) => { if (QUESTIONS[i].kind === "e") { e[v]++; lastE[v] = i; } else { s[v]++; lastS[v] = i; } });
  // 同点なら、あとで選んだほうを採る
  const rank = (sc, last) => Object.keys(sc).sort((a, b) => sc[b] - sc[a] || (last[b] ?? -1) - (last[a] ?? -1));
  const re = rank(e, lastE), rs = rank(s, lastS);
  return { e, s, el: re[0], st: rs[0], el2: re[1], tie: e[re[0]] === e[re[1]] || s[rs[0]] === s[rs[1]] };
}

const app = document.getElementById("app");
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let answers = [], step = 0, current = () => renderCover();

function setLang(l) {
  lang = l; save(KEY_LANG, l);
  document.documentElement.lang = l;
  document.title = UI[l].title;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  current();
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => setLang(b.dataset.lang));

function renderQuestion() {
  current = renderQuestion;
  const u = U(), q = QUESTIONS[step], keys = Object.keys(TYPES);
  app.innerHTML = `
    <section class="quiz fade">
      <div class="progress" aria-hidden="true"><i style="width:${((step + 1) / QUESTIONS.length) * 100}%"></i></div>
      <div class="q-top">
        <button class="back" id="back" ${step === 0 ? "disabled" : ""}>← ${u.back}</button>
        <span class="q-count">${step + 1} / ${QUESTIONS.length}</span>
      </div>
      <div class="q-watch">${disc(keys[(step * 5) % keys.length])}</div>
      <h2 class="q-title title">${esc(L(q.q))}</h2>
      <div class="options">
        ${q.o.map(([label, v]) => `<button class="option ${answers[step] === v ? "picked" : ""}" data-v="${v}">${esc(L(label))}</button>`).join("")}
      </div>
    </section>`;
  document.getElementById("back").onclick = () => { step--; renderQuestion(); };
  app.querySelectorAll(".option").forEach(b => b.onclick = () => {
    app.querySelectorAll(".option").forEach(o => o.classList.remove("picked"));
    answers[step] = b.dataset.v; b.classList.add("picked");
    setTimeout(() => {
      if (step < QUESTIONS.length - 1) { step++; renderQuestion(); return; }
      const r = score(answers), key = `${r.el}-${r.st}`;
      save(KEY_TYPE, key); save(KEY_ANS, JSON.stringify(answers)); save(KEY_OPEN, null);
      renderLoading(key);
    }, 220);
  });
  window.scrollTo({ top: 0 });
}

function renderLoading(key) {
  const u = U(), keys = Object.keys(TYPES);
  current = () => renderLoading(key);
  app.innerHTML = `<section class="loading fade"><div id="spin">${disc(keys[0], true)}</div><p>${u.loading}</p><div class="small muted">${u.loadingSub}</div></section>`;
  if (reduceMotion) { renderResult(key, true); return; }
  let i = 0;
  const spin = document.getElementById("spin");
  const timer = setInterval(() => { i++; if (spin.isConnected) spin.innerHTML = disc(keys[i % keys.length], true); }, 160);
  setTimeout(() => { clearInterval(timer); renderResult(key, true); }, 1900);
}

      <div class="animal">${esc(L(t.animal))}</div>
      <div class="pun">${esc(L(t.pun))}</div>
      <div class="chips"><span class="chip">${esc(L(ELEMENTS[el]))}</span><span class="chip">${esc(L(STYLES[st]))}</span></div>
      <p class="catch">${esc(L(t.catch))}</p>
      <div class="phrase">${u.phrase} ${esc(u.quote(L(t.phrase)))}</div>

    <section class="sec" id="friends"></section>

      <button class="btn" id="share">${u.share}</button>

  document.getElementById("retry").onclick = () => { save(KEY_TYPE, null); answers = []; step = 0; renderQuestion(); };

}

function renderWhy(key) {
  const u = U(), box = document.getElementById("why"), ans = savedAnswers();
  if (!ans) { box.innerHTML = `<p class="muted">${u.noAnswers}</p>`; return; }
  const r = score(ans), t = TYPES[key];
  const bars = (sc, labels, win) => Object.keys(sc).sort((a, b) => sc[b] - sc[a]).map(k =>
    `<div class="bar ${k === win ? "win" : ""}"><span>${esc(L(labels[k]))}</span><span class="track"><i style="width:${sc[k] / 6 * 100}%;${k === win ? `background:var(--${r.el})` : ""}"></i></span><span class="n">${sc[k]}/6</span></div>`).join("");
  const picks = (kind, win) => QUESTIONS.map((q, i) => ({ q, i })).filter(({ q, i }) => q.kind === kind && ans[i] === win).slice(0, 3)
    .map(({ q, i }) => `<li>${esc(L(q.o.find(o => o[1] === ans[i])[0]))}<small>Q${i + 1}. ${esc(L(q.q))}</small></li>`).join("");
  const el2 = TYPES[`${r.el2}-${r.st}`];
  box.innerHTML = `
    <p class="summary">${esc(u.whySummary(r.e[r.el], L(ELEMENTS[r.el].long), r.s[r.st], L(STYLES[r.st].long), L(t.name)))}${r.tie ? `<br><span class="small muted">${u.tie}</span>` : ""}</p>
    <div class="axis"><div class="axis-name">${u.whyAxisE}</div>${bars(r.e, ELEMENTS, r.el)}</div>
    <div class="axis"><div class="axis-name">${u.whyAxisS}</div>${bars(r.s, STYLES, r.st)}</div>
    <div class="keys-title">${u.keyAnswers}</div>
    <ul class="keys">${picks("e", r.el)}${picks("s", r.st)}</ul>
    ${r.e[r.el2] > 0 ? `<p class="note">${esc(u.runnerUp(L(el2.name), L(ELEMENTS[r.el2].long)))}</p>` : ""}`;
}

function renderToday(key) {
  const u = U(), box = document.getElementById("today"), t = TYPES[key], el = key.split("-")[0];
  const f = fortuneFor(key), prompt = L(t.prompts)[f.prompt];
  const d = new Date(), dow = u.dow[d.getDay()];
  const dateLabel = lang === "ja" ? `${d.getMonth() + 1}月${d.getDate()}日（${dow}）` : `${dow}, ${d.toLocaleString("en", { month: "short" })} ${d.getDate()}`;
  const head = `<span class="kicker">${u.todayKicker}</span><h3 class="title">${u.todayTitle}</h3>`;
  if (load(KEY_OPEN) !== todayStr()) {
    box.innerHTML = `${head}<div class="today t-${el}"><div class="waiting">
      <div class="today-head" style="justify-content:center">${dateLabel}</div>
      <p>${esc(u.todayWaiting(L(t.name)))}</p>
      <button class="btn small" id="open">${u.openToday}</button></div></div>`;
    document.getElementById("open").onclick = () => { markOpened(); renderToday(key); };
    return;
  }
  box.innerHTML = `${head}
    <div class="today t-${el} fade">
      <div class="today-head"><span>${dateLabel}</span><span>${u.streak(streak().count || 1)}</span></div>
      <p class="message">${esc(L(f.message))}</p>
      <div class="prompt">
        <span class="label">${u.luckyPrompt}</span>
        <b class="ptitle">${esc(prompt.title)}</b>
        <div class="text" id="lucky">${esc(prompt.body)}</div>
        <div class="row"><button class="btn small ghost" id="copy">${u.copy}</button></div>
      </div>
      <div class="news" id="news" hidden></div>
      <div class="cheer"><span class="label">${u.cheerLabel}</span><p>${esc(L(f.cheer))}</p></div>
    </div>
    <p class="note">${u.tomorrow}</p>
    <div class="slack">
      <button class="btn small ghost" id="slack">${u.slackButton}</button>
      <p class="note">${u.slackNote}</p>
    </div>`;
  document.getElementById("copy").onclick = () => copyPrompt(prompt.body);
  loadNews(key);
  document.getElementById("slack").onclick = async () => {
    try { await navigator.clipboard.writeText(u.slackCommand(SHARE_URL)); toast(u.slackCopied); }
    catch (e) { toast(u.shareFailed); }
  };
}

/* ---------- 今日のAIニュース：Claude が調べて保存したものを読む。読めない環境では出さない ---------- */
let newsDoc;
async function loadNews(key) {
  if (newsDoc === undefined) {
    newsDoc = null;
    try {
      const res = await fetch("news.json", { cache: "no-store" });
      if (res.ok) newsDoc = await res.json();
    } catch (e) { newsDoc = null; }
  }
  const box = document.getElementById("news"), it = newsDoc && newsDoc.items && newsDoc.items[key];
  if (!box || !it || !it[lang] || !/^https:\/\//.test(it.url || "")) return;
  const u = U(), n = it[lang];
  box.innerHTML = `
    <span class="label">${u.newsLabel}</span>
    <a class="news-title" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
    <div class="news-meta">${esc(it.source)} ・ ${esc(it.published)}</div>
    <p>${esc(n.summary)}</p>
    <p class="news-why"><b>${u.newsWhy}</b>${esc(n.why)}</p>`;
  box.hidden = false;
}

function renderFriends(myKey, currentKey, from) {
  const u = U(), box = document.getElementById("friends"), keys = Object.keys(TYPES);

      ${keys.map(k => `<button class="friend ${k === myKey ? "me" : ""}" data-profile="${k}" aria-current="${k === currentKey}">${disc(k, true)}<b>${esc(L(TYPES[k].name))}</b></button>`).join("")}
    </div>

function bindProfileLinks(myKey, from) {

      <h3 class="title">${u.axesTitle}</h3>
      <dl class="facets">
        <dt>${u.axisE}</dt><dd><b>${esc(L(ELEMENTS[el]))}</b> — ${esc(u.axisELine(L(ELEMENTS[el].long)))}</dd>
        <dt>${u.axisS}</dt><dd><b>${esc(L(STYLES[st]))}</b> — ${esc(u.axisSLine(L(STYLES[st].long)))}</dd>

    ${profileSections(key)}

    <section class="sec">
      <span class="kicker">PROMPTS</span>
      <h3 class="title">${esc(u.promptsTitle(L(t.name)))}</h3>

        ${L(t.prompts).map((pr, i) => `<li><details ${i === 0 ? "open" : ""}><summary>${esc(pr.title)}</summary><div class="text" id="pr-${i}">${esc(pr.body)}</div><div class="row"><button class="btn small ghost" data-copy="${i}">${u.copy}</button></div></details></li>`).join("")}

      <button data-profile="${next}">${esc(L(TYPES[next].name))} →</button>
    </nav>
    <div class="actions"><button class="btn ghost" data-back>${backLabel}</button></div>`;
  renderFriends(myKey, key, from);
  bindProfileLinks(myKey, from);
  app.querySelectorAll("[data-back]").forEach(b => b.onclick = () => {
    if (from === "result" && myKey && TYPES[myKey]) renderResult(myKey, false); else renderCover();
    window.scrollTo({ top: 0 });
  });
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyPrompt(L(t.prompts)[b.dataset.copy].body, "pr-" + b.dataset.copy));
  window.scrollTo({ top: 0 });
}

/* 端末の共有メニューを開く。使えない環境では、シェア文をコピーする */
const SHARE_URL = "https://ally-ak.github.io/ai-dev-animal/";
async function shareResult(text, key) {
  const url = `${SHARE_URL}r/${key}${lang === "en" ? "-en" : ""}.html`;
  if (navigator.share) {
    try {
      // スマホでは画像を添付してシェアする。Xは添付画像があるとリンクのカード（見出しの黒帯つき）を出さない
      if (navigator.canShare) {
        const blob = await (await fetch(`og/${key}-${lang}.png`)).blob();
        const file = new File([blob], `${key}.png`, { type: "image/png" });
        if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: `${text}\n${url}` }); return; }
      }
      await navigator.share({ text, url }); return;
    }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast(U().shareCopied); }
  catch (e) { toast(U().shareFailed); }
}

function copyPrompt(text, id = "lucky") {
  const fallback = () => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById(id));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    toast(U().selected);
  };
  try { navigator.clipboard.writeText(text).then(() => toast(U().copied), fallback); } catch (e) { fallback(); }
}
let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

const savedType = load(KEY_TYPE);
current = savedType && TYPES[savedType] ? () => renderResult(savedType, false) : renderCover;
setLang(lang);
</script>
